<style>:root{
  --ink:#10243a; --ink-2:#3b4d63; --ink-3:#6b7a8c;
  --paper:#e9edf0; --card:#ffffff; --line:#c9d2db; --line-2:#dde3e9;
  --web:#2f68c2; --web-ink:#ffffff; --web-dk:#2757a5; --green:#3fcb4f; --blue:#3f7fdb;
  --apto:#1f7a4d; --apto-bg:#e2f3ea; --nook:#b42318; --nook-bg:#fbe6e3; --obs:#9a5b00; --obs-bg:#fdf0d5;
  --focus:#1558d6;
  --r:6px;
  --font:"Bahnschrift","Segoe UI","Roboto","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.top{background:#000;color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--blue)}
.top-in{max-width:1180px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{display:block;height:50px;width:auto}
.top .grow{flex:1}
.chip{font-size:.82rem;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.chip.ok::before{content:"● ";color:var(--green)}.chip.warn::before{content:"● ";color:#ffc400}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:1.55rem;margin:.2rem 0 .2rem;line-height:1.2}
h2{font-size:1.15rem;margin:0 0 .6rem}
.sub{color:var(--ink-2);margin:0 0 1.1rem;max-width:70ch}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);text-decoration:none;font-size:.95rem;padding:6px 0;margin-bottom:6px}
.back:hover{color:var(--ink);text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
.card.stitch{border-style:dashed;border-width:2px;border-color:#aeb9c5}
/* menú */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group>header{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--ink);color:#fff;border-left:5px solid var(--green)}
.group>header b{display:grid;place-items:center;width:30px;height:30px;border-radius:5px;background:var(--web);color:var(--ink);font-size:1.05rem}
.group>header span{font-weight:650}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:0;border-top:1px solid var(--line-2);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink);min-height:52px}
.opt:hover{background:#f3f6f9}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt small{display:block;color:var(--ink-3);font-size:.85rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--ink-2);font-size:.95rem;margin:10px 0 18px}
.stats b{color:var(--ink);font-size:1.1rem}
/* formularios */
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(12,1fr)}
.f{grid-column:span 12;display:flex;flex-direction:column;gap:4px;min-width:0}
@media(min-width:720px){.f.s6{grid-column:span 6}.f.s4{grid-column:span 4}.f.s3{grid-column:span 3}.f.s8{grid-column:span 8}.f.s2{grid-column:span 2}}
label,.lbl{font-size:.88rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=search],input:not([type]),select,textarea{width:100%;padding:10px 11px;border:1.5px solid #9aa8b6;border-radius:5px;background:#fff;min-height:44px}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:#eef1f4;color:var(--ink-2)}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
.hint{font-size:.84rem;color:var(--ink-3)}
.req::after{content:" *";color:var(--nook)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:5px;border:1.5px solid var(--ink);background:#fff;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f0f3f6}
.btn.pri{background:var(--web);border-color:var(--web-dk);color:var(--web-ink)}
.btn.pri:hover{background:#2757a5}
.btn.dng{border-color:var(--nook);color:var(--nook)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 18px;font-weight:650;cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.list{border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:60vh;overflow:auto}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line-2);background:#fff;text-align:left;cursor:pointer}
.li:hover,.li[aria-selected=true]{background:#e8f0fc}
.li small{color:var(--ink-3)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:650;background:#e8edf2;color:var(--ink-2)}
.pill.apto{background:var(--apto-bg);color:var(--apto)}.pill.nook{background:var(--nook-bg);color:var(--nook)}
.msg{padding:12px 14px;border-radius:5px;border:1px solid;margin:0 0 14px}
.msg.ok{background:var(--apto-bg);border-color:#9fd3b6;color:#14573a}
.msg.warn{background:var(--obs-bg);border-color:#e8c27a;color:#6d4200}
.msg.err{background:var(--nook-bg);border-color:#efa59d;color:#8a1a11}
.msg.info{background:#e6eefb;border-color:#b3c8ee;color:#12366f}
/* editor de certificado */
.lines{margin-top:8px}
.lh,.lr{display:grid;gap:8px;align-items:start;grid-template-columns:30px minmax(190px,2.3fr) minmax(110px,1.1fr) minmax(90px,.9fr) 150px 170px minmax(150px,1.4fr)}
.lh{font-size:.8rem;font-weight:650;color:var(--ink-2);padding:6px 8px;background:#dfe6ec;border-radius:5px 5px 0 0;position:sticky;top:65px;z-index:5}
.lr{padding:8px;border-bottom:1px solid var(--line-2);background:#fff}
.lr:nth-child(even){background:#f8fafb}
.lr .c{min-width:0;display:flex;flex-direction:column;gap:4px}
.lr .c>label:not(.star){display:none}
.lr input[type=checkbox]{width:22px;height:22px;margin-top:10px}
.lr select,.lr input{min-height:40px;padding:7px 8px}
.my{display:flex;gap:4px}.my select{flex:1;min-width:0}
.star{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--ink-2)}
.star input{width:18px;height:18px;margin:0}
.res-apto{border-color:var(--apto)!important;background:var(--apto-bg)}
.res-nook{border-color:var(--nook)!important;background:var(--nook-bg)}
.res-obs{border-color:var(--obs)!important;background:var(--obs-bg)}
@media(max-width:980px){
  .lh{display:none}
  .lr{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;margin:10px 0;gap:10px}
  .lr .c>label:not(.star){display:block}
  .lr .c.sel>label{display:inline!important}
  .lr .c.art,.lr .c.res{grid-column:1/-1}
  .lr .sel{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}
  .lr .sel input{margin:0}
}
.stickybar{position:sticky;bottom:0;background:linear-gradient(#e9edf000,var(--paper) 22%);padding:16px 0 4px;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th,table.t td{border-bottom:1px solid var(--line-2);padding:7px 10px;text-align:left}
table.t th{background:#dfe6ec;font-size:.84rem}
table.t td.n,table.t th.n{text-align:right}
dialog{border:0;border-radius:8px;padding:0;max-width:min(560px,94vw);box-shadow:0 20px 60px rgba(16,36,58,.35)}
dialog::backdrop{background:rgba(16,36,58,.55)}
dialog .in{padding:20px}
dialog .bar{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:6px;z-index:60;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.files a{display:inline-flex;margin:4px 8px 4px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.88rem}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
details.rep{border:1px solid var(--line);border-radius:6px;margin:0 0 10px;background:#fff}
details.rep summary{cursor:pointer;padding:11px 14px;font-weight:650}
details.rep .in{padding:0 14px 12px;color:var(--ink-2);font-size:.93rem}
details.rep ul{margin:.3rem 0 .6rem;padding-left:1.2rem}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
@media print{.top,.stickybar,.bar{display:none}}

.bad{border-color:var(--nook)!important;box-shadow:0 0 0 2px #e0453a33;background:var(--nook-bg)}
.my.bad select{border-color:var(--nook)!important}
.lr.hl,.lr.hl:nth-child(even){background:#d3f0d7!important;box-shadow:inset 4px 0 0 var(--green)}
.lr.hl input:not([type=checkbox]),.lr.hl select{background:#f1fbf2}
.grid>.s12{grid-column:1/-1}
@media(min-width:720px){.grid>.s3:not(.f){grid-column:span 3}.grid>.s6:not(.f){grid-column:span 6}}
.grid>h2{font-size:1.05rem}
.grid .hint{margin:0}
.lr .star input{width:18px;height:18px;margin:0}

.chip.bad::before{content:"● ";color:#ff5a4d}
button.chip{border:0;color:#fff;font:inherit;font-size:.82rem;cursor:pointer;text-align:left}
button.chip:hover{background:rgba(255,255,255,.22)}
.top-in{flex-wrap:wrap}
.top .syncbtn{background:var(--web);color:#fff;border:0;border-radius:99px;padding:5px 14px;font:inherit;font-size:.85rem;font-weight:650;cursor:pointer;min-height:32px}
.top .syncbtn[disabled]{opacity:.6}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.top-in{padding:6px 12px}.chips{width:100%;padding-bottom:4px}.brand img{height:42px}}
table.kv{border-collapse:collapse;width:100%}table.kv td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}table.kv td:first-child{color:var(--ink-3);width:38%}

/* QR y escáner */
.lr .qrb{align-self:flex-start;min-height:32px;padding:3px 12px}
.lr.scanhit,.lr.scanhit:nth-child(even){background:#fff4b8!important;outline:3px solid #f0a400;outline-offset:-3px;animation:scanpulse 1s ease-in-out 3}
@keyframes scanpulse{50%{outline-color:#fff}}
.scanpanel{position:sticky;top:64px;z-index:6;margin:0 0 10px;padding:10px;border:2px solid var(--blue)}
.scanmsg{margin-top:8px;font-weight:600}
.scanmsg.ok{color:var(--apto)}.scanmsg.warn{color:var(--obs)}.scanmsg.bad{color:var(--nook)}
@media (prefers-reduced-motion:reduce){.lr.scanhit{animation:none}}

<script>/* reader.js — lectura de tablas de .doc (Word 97-2003) y .docx sin dependencias.
   Devuelve siempre: [ [ [celda,celda,...], ...filas ], ...tablas ]  */
(function (root) {
'use strict';
const CP1252 = {0x80:'€',0x82:'‚',0x83:'ƒ',0x84:'„',0x85:'…',0x86:'†',0x87:'‡',0x88:'ˆ',0x89:'‰',0x8A:'Š',0x8B:'‹',0x8C:'Œ',0x8E:'Ž',
 0x91:'‘',0x92:'’',0x93:'“',0x94:'”',0x95:'•',0x96:'–',0x97:'—',0x98:'˜',0x99:'™',0x9A:'š',0x9B:'›',0x9C:'œ',0x9E:'ž',0x9F:'Ÿ'};

  const nFat=u32(b,0x2C), dir0=u32(b,0x30), cutoff=u32(b,0x38), mfat0=u32(b,0x3C), nMfat=u32(b,0x40), difat0=u32(b,0x44), nDifat=u32(b,0x48);

C.joinName = (articulo,marca,fabricante) => clean([articulo,marca,fabricante].filter(Boolean).join(' '));

const STOP=new Set(['s','a','l','sl','sa','slu','de','del','la','el','y','by','hotel','hoteles','hotels','grupo']);
const toks = n => new Set(ckey(n).split(' ').filter(t=>t&&!STOP.has(t)));
function similarNames(a,b){ const A=toks(a),B=toks(b); let n=0; for (const t of A) if (B.has(t)) n++; return ckey(a)===ckey(b) || (n>0 && n/Math.min(A.size,B.size)>=0.5); }
C.findCliente = function (db,{nombre,cif}) {
  const c=C.cleanCif(cif||''), k=ckey(nombre||'');
  if (c) { const cand=db.clientes.filter(x=>C.cleanCif(x.cif)===c);
    if (cand.length===1 && (!k || similarNames(cand[0].nombre,nombre))) return cand[0];
    if (cand.length>1) { const hit=cand.find(x=>ckey(x.nombre)===k); if (hit) return hit; if (!k) return cand[0]; } }
  if (k) { const hit=db.clientes.find(x=>ckey(x.nombre)===k); if (hit) return hit; }
  return null;
};
C.findInstalacion = (db,clienteId,nombre) => { const k=ikey(nombre); return db.instalaciones.find(i=>i.cliente_id===clienteId && ikey(i.nombre)===k)||null; };
C.addCliente = function (db,d) {
  const p = d.cp!==undefined? {poblacion:d.poblacion,cp:d.cp} : C.splitPob(d.poblacion||'');
  const c={cliente_id:nextId(db.clientes,'cliente_id','C',3),nombre:clean(d.nombre),cif:C.cleanCif(d.cif||''),actividad:clean(d.actividad||''),direccion:clean(d.direccion||''),poblacion:p.poblacion,codigo_postal:p.cp||d.codigo_postal||''};
  db.clientes.push(c); db._cli&&db._cli.set(c.cliente_id,c); return c;
};
C.addInstalacion = function (db,d) {
  const p = d.cp!==undefined? {poblacion:d.poblacion,cp:d.cp} : C.splitPob(d.poblacion||'');
  const i={instalacion_id:nextId(db.instalaciones,'instalacion_id','I',3),cliente_id:d.cliente_id,nombre:clean(d.nombre),actividad:clean(d.actividad||''),direccion:clean(d.direccion||''),poblacion:p.poblacion,codigo_postal:p.cp||d.codigo_postal||''};
  db.instalaciones.push(i); db._ins&&db._ins.set(i.instalacion_id,i); return i;
};
C.addArticulo = function (db,{articulo,marca,fabricante,texto}) {
  const name = clean(texto || C.joinName(articulo,marca,fabricante)); const n=norm(name);
  const hit = db._artNorm && db._artNorm.get(n); if (hit) return hit;
  const a={articulo_id:nextId(db.articulos,'articulo_id','A',4),articulo_marca_fabricante:name,tipo:clean(articulo)||C.tipoDe(n),marca:clean(marca)||C.marcaDe(n),fabricante:clean(fabricante||'')};
  db.articulos.push(a); db._art&&db._art.set(a.articulo_id,a); db._artNorm&&db._artNorm.set(n,a); return a;
};
/* el número REPI es único en toda la base de datos: siguiente libre del año (de cualquier instalación) */
C.nextCode = function (db,_instalacionId,year) {
  const yy=String(year).slice(-2); let max=0;
  for (const c of db.certificados) { const m=C.codeNorm(c.codigo||'').match(/^REPI (\d+)\/(\d{2})$/); if (m&&m[2]===yy&&+m[1]>max) max=+m[1]; }
  return `REPI ${pad2(max+1)}/${yy}`;
};
C.codeValid = c => /^REPI \d{2,}\/\d{2}$/.test(C.codeNorm(c));
C.certByCode = (db,code,exceptId) => { const n=C.codeNorm(code); return db.certificados.find(c=>c.cert_id!==exceptId && C.codeNorm(c.codigo)===n)||null; };

C.lastCert = function (db,instalacionId) {
  let best=null; for (const c of db.certificados) if (c.instalacion_id===instalacionId && (!best || (c.fecha_revision||'')>(best.fecha_revision||'') || ((c.fecha_revision||'')===(best.fecha_revision||'') && c.cert_id>best.cert_id))) best=c;
  return best;
};
C.touch = db => { db.meta.updated=C.nowIso(); return db; };

/* guarda un certificado completo (nuevo o existente) con sus líneas ya resueltas */
C.saveCert = function (db, cert, lineas) {
  const now=C.nowIso(); let c;
  if (cert.cert_id && db._cert.get(cert.cert_id)) { c=db._cert.get(cert.cert_id); Object.assign(c,cert,{modificado:now}); }
  else { c=Object.assign({observaciones_en:'',idioma:'ES',ficheros_origen:''},cert,{cert_id:nextId(db.certificados,'cert_id','R',4),modificado:now}); db.certificados.push(c); db._cert.set(c.cert_id,c); }
  db.lineas = db.lineas.filter(l=>l.cert_id!==c.cert_id);
  let id=db.lineas.reduce((m,l)=>Math.max(m,l.id||0),0);
  const out = lineas.map(l=>({id:++id,cert_id:c.cert_id,articulo_id:l.articulo_id||'',articulo:l.articulo||'',numero_serie:clean(l.numero_serie).replace(/^\[\s*(.*?)\s*\]$/,'$1'),usuario:clean(l.usuario),
     fecha_fabrica:clean(l.fecha_fabrica),fecha_caducidad:clean(l.fecha_caducidad),caducidad_prolongada:l.caducidad_prolongada?1:0,resaltado:l.resaltado?1:0,observaciones:clean(l.observaciones)}));
  db.lineas.push(...out); C.index(db); C.touch(db); return c;
};
C.keyCert = (db,c) => { const i=(db._ins&&db._ins.get(c.instalacion_id))||{}, cl=(db._cli&&db._cli.get(c.cliente_id))||{}; return ckey(cl.nombre||'')+'>'+ikey(i.nombre||'')+'|'+C.codeNorm(c.codigo)+'|'+(c.fecha_revision||''); };
C.linesSig = ls => JSON.stringify(ls.map(l=>[norm(l.articulo),norm(l.numero_serie),norm(l.usuario),l.fecha_fabrica||'',l.fecha_caducidad||'',l.caducidad_prolongada?1:0,l.resaltado?1:0,(l.observaciones||'').trim()]));
C.deleteCert = function (db,id) { const old=db._cert&&db._cert.get(id); if (old) { db.eliminados=(db.eliminados||[]).filter(t=>t.k!==C.keyCert(db,old)); db.eliminados.push({k:C.keyCert(db,old),ts:C.nowIso()}); if (db.eliminados.length>2000) db.eliminados=db.eliminados.slice(-2000); } db.certificados=db.certificados.filter(c=>c.cert_id!==id); db.lineas=db.lineas.filter(l=>l.cert_id!==id); C.index(db); C.touch(db); };

/* ------------------------------------------- importar bloques de un documento */
C.importBlocks = function (db, blocks, fileName) {
  const rep={fichero:fileName,clientesNuevos:[],instalacionesNuevas:[],articulosNuevos:[],certNuevos:[],certExistentes:[],lineasNuevas:0,lineasYaExistian:0,avisos:[]};
  if (!blocks.length) { rep.avisos.push('No se ha encontrado ningún certificado REPI en el documento.'); return rep; }
  const touched = new Map(), snap = new Map();
  for (const b of blocks) {
    const h=b.head, cn=clean(h.cliente.NOMBRE||'').replace(/\s+[AB]-?\d{8}$/,''), cif=C.cleanCif(h.cliente.CIF||'');
    let inom=clean(h.instalacion.NOMBRE||''); if (!inom) inom=cn;
    const codigo=C.codeNorm(h.codigo), frev=C.pdate(h.fecha_rev), fprox=C.pdate(h.fecha_prox);
    if (!codigo || !frev) { rep.avisos.push(`Página sin código o fecha de revisión legible (${h.codigo||'?'} / ${h.fecha_rev||'?'}): omitida.`); continue; }
    // cliente
    let cli=C.findCliente(db,{nombre:cn,cif});
    if (!cli && (!cn || !cif)) {   // sin cliente reconocible: se deduce por la instalación (mismo nombre y actividad)
      const act=norm(h.instalacion.ACTIVIDAD||'');
      let cand=db.instalaciones.filter(i=>ikey(i.nombre)===ikey(inom) && norm(i.actividad)===act);
      if (!cand.length && !cn) cand=db.instalaciones.filter(i=>ikey(i.nombre)===ikey(inom));
      const ids=[...new Set(cand.map(i=>i.cliente_id))];
      if (ids.length===1) { cli=db._cli.get(ids[0]); rep.avisos.push(`Cliente '${cn||'(vacío)'}' deducido por la instalación: ${cli.nombre}.`); } }
    if (!cli) {
      if (!cn) { rep.avisos.push('El documento no indica el cliente y no se ha podido deducir: omitida una página.'); continue; }
      cli=C.addCliente(db,{nombre:cn,cif,direccion:h.cliente.DIRECCION,poblacion:h.cliente.POBLACION}); rep.clientesNuevos.push(cli.nombre);
    }
    // instalación
    let ins=C.findInstalacion(db,cli.cliente_id,inom);
    if (!ins) { ins=C.addInstalacion(db,{cliente_id:cli.cliente_id,nombre:inom,actividad:h.instalacion.ACTIVIDAD,direccion:h.instalacion.DIRECCION,poblacion:h.instalacion.POBLACION}); rep.instalacionesNuevas.push(`${ins.nombre} (${cli.nombre})`); }
    // certificado
    let cert=db.certificados.find(c=>c.codigo===codigo && c.instalacion_id===ins.instalacion_id && c.fecha_revision===frev);
    let isNew=false;
    if (!cert) { cert={cert_id:nextId(db.certificados,'cert_id','R',4),codigo,fecha_revision:frev,fecha_proxima_revision:fprox,cliente_id:cli.cliente_id,instalacion_id:ins.instalacion_id,observaciones:'',observaciones_en:'',idioma:b.en?'EN':'ES',ficheros_origen:fileName,modificado:C.nowIso()}; db.certificados.push(cert); db._cert.set(cert.cert_id,cert); db._lin.set(cert.cert_id,[]); isNew=true; rep.certNuevos.push(`${codigo} · ${ins.nombre} · ${C.fmtDate(frev)}`); const otro=db.certificados.find(x=>x.cert_id!==cert.cert_id&&C.codeNorm(x.codigo)===codigo); if (otro) rep.avisos.push(`El número ${codigo} ya lo usa otro certificado (${(db._ins.get(otro.instalacion_id)||{}).nombre||'?'}, ${C.fmtDate(otro.fecha_revision)}). Se ha importado igualmente.`); }
    else if (!touched.has(cert.cert_id)) rep.certExistentes.push(`${codigo} · ${ins.nombre} · ${C.fmtDate(frev)}`);
    touched.set(cert.cert_id,cert);
    const obsTxt=b.obs.join('\n');
    if (obsTxt) { const f=b.en?'observaciones_en':'observaciones'; if (!cert[f]) cert[f]=obsTxt; else if (!cert[f].includes(obsTxt)) cert[f]+='\n'+obsTxt; }
    // líneas: se compara con lo que el certificado ya tenía ANTES de este documento
    if (!snap.has(cert.cert_id)) {
      const ser=new Set(), blank=new Map();
      for (const l of (db._lin.get(cert.cert_id)||[])) {
        if (norm(l.numero_serie)) ser.add(norm(l.numero_serie)+'|'+C.tipoDe(norm(l.articulo)));
        else { const k='~'+norm(l.articulo)+'|'+norm(l.usuario)+'|'+norm(l.fecha_fabrica)+'|'+norm(l.fecha_caducidad); blank.set(k,(blank.get(k)||0)+1); } }
      snap.set(cert.cert_id,{ser,blank,exact:new Set(),fileBlank:new Map()});
    }
    const S=snap.get(cert.cert_id);
    for (const e of b.equip) {
      const art=clean(e.articulo), serie=clean(e.serie); if (!art && !serie) continue;
      const cadTxt=clean(e.cad).replace(/\*/g,'').trim();
      if (norm(serie)) {
        const full=[serie,art,e.usuario,e.fab,e.cad,e.obs].map(norm).join('|');
        if (S.exact.has(full)) { rep.lineasYaExistian++; continue; }       // línea repetida idéntica en el mismo documento
        S.exact.add(full);
        if (S.ser.has(norm(serie)+'|'+C.tipoDe(norm(art)))) { rep.lineasYaExistian++; continue; }   // ya estaba en la base
      } else {
        const k='~'+norm(art)+'|'+norm(e.usuario)+'|'+norm(e.fab)+'|'+norm(cadTxt);
        const have=S.blank.get(k)||0, mine=S.fileBlank.get(k)||0;
        if (have>mine) { S.fileBlank.set(k,mine+1); rep.lineasYaExistian++; continue; }
        S.fileBlank.set(k,mine+1);
      }
      const n0=db.articulos.length; const a=C.addArticulo(db,{texto:art}); if (db.articulos.length>n0) rep.articulosNuevos.push(a.articulo_marca_fabricante);
      const id=db.lineas.reduce((m,l)=>Math.max(m,l.id||0),0)+1;
      const l={id,cert_id:cert.cert_id,articulo_id:a.articulo_id,articulo:art,numero_serie:String(serie).replace(/^\[\s*(.*?)\s*\]$/,'$1'),usuario:clean(e.usuario),fecha_fabrica:clean(e.fab),fecha_caducidad:clean(e.cad).replace(/\*/g,'').trim(),caducidad_prolongada:/\*/.test(e.cad)?1:0,observaciones:clean(e.obs)};
      db.lineas.push(l); db._lin.get(cert.cert_id).push(l); rep.lineasNuevas++;
      if (!isNew) cert.modificado=C.nowIso();
    }
  }
  if (rep.lineasNuevas || rep.certNuevos.length) C.touch(db);
  return rep;
};

/* ------------------------------------------------------- tablas de exportación */
C.COLS = {
 clientes:['cliente_id','nombre','cif','actividad','direccion','poblacion','codigo_postal'],
 instalaciones:['instalacion_id','cliente_id','cliente','nombre','actividad','direccion','poblacion','codigo_postal'],
 articulos:['articulo_id','articulo_marca_fabricante','tipo','marca','fabricante','n_apariciones'],
 certificados:['cert_id','codigo','fecha_revision','fecha_proxima_revision','cliente_id','cliente','instalacion_id','instalacion'],
 numeros_serie:['id','cert_id','codigo','fecha_revision','fecha_proxima_revision','cliente_id','cliente','instalacion_id','instalacion','articulo_id','articulo','numero_serie','usuario','fecha_fabrica','anio_fabrica','mes_fabrica','fecha_caducidad','anio_caducidad','mes_caducidad','caducidad_prolongada','resaltado','resultado','observaciones','equipo_id','ultima_revision'],
 certificados_completo:['cert_id','codigo','fecha_revision','fecha_proxima_revision','cliente_id','cliente','cif','cliente_direccion','cliente_poblacion','instalacion_id','instalacion','instalacion_actividad','instalacion_direccion','instalacion_poblacion','n_equipos','n_apto','n_no_apto','observaciones','observaciones_en','idioma','es_ultima_de_instalacion','modificado','ficheros_origen','equipos_json']};
C.toTables = function (db) {
  C.index(db);
  const cli=id=>db._cli.get(id)||{}, ins=id=>db._ins.get(id)||{};
  const T={};
  T.clientes=db.clientes.map(c=>({...c}));
  T.instalaciones=db.instalaciones.map(i=>({...i,cliente:cli(i.cliente_id).nombre||''}));
  const uses=new Map(); for (const l of db.lineas) uses.set(l.articulo_id,(uses.get(l.articulo_id)||0)+1);
  T.articulos=db.articulos.map(a=>({...a,n_apariciones:uses.get(a.articulo_id)||0}));
  const certs=[...db.certificados].sort((a,b)=>(a.fecha_revision||'').localeCompare(b.fecha_revision||'')||a.cert_id.localeCompare(b.cert_id));
  const lastBy=new Map(); for (const c of certs) lastBy.set(c.instalacion_id,c.cert_id);
  T.certificados=certs.map(c=>({cert_id:c.cert_id,codigo:c.codigo,fecha_revision:c.fecha_revision,fecha_proxima_revision:c.fecha_proxima_revision,cliente_id:c.cliente_id,cliente:cli(c.cliente_id).nombre||'',instalacion_id:c.instalacion_id,instalacion:ins(c.instalacion_id).nombre||''}));
  const eqId=new Map(); const rowsNs=[]; let n=0;
  for (const c of certs) for (const l of C.certLines(db,c.cert_id)) {
    const fy=C.pyear(l.fecha_fabrica), cy=C.pyear(l.fecha_caducidad), res=C.resultado(l.observaciones);
    const sk=norm(l.numero_serie); const ek=c.instalacion_id+'|'+(sk||('~'+norm(l.articulo)+'|'+norm(l.usuario)+'|'+norm(l.fecha_fabrica)));
    if (!eqId.has(ek)) eqId.set(ek,'E'+String(eqId.size+1).padStart(5,'0'));
    rowsNs.push({id:++n,cert_id:c.cert_id,codigo:c.codigo,fecha_revision:c.fecha_revision,fecha_proxima_revision:c.fecha_proxima_revision,cliente_id:c.cliente_id,cliente:cli(c.cliente_id).nombre||'',instalacion_id:c.instalacion_id,instalacion:ins(c.instalacion_id).nombre||'',
      articulo_id:l.articulo_id,articulo:l.articulo,numero_serie:l.numero_serie,usuario:l.usuario,fecha_fabrica:l.fecha_fabrica,anio_fabrica:fy.anio||'',mes_fabrica:fy.mes||'',fecha_caducidad:l.fecha_caducidad,anio_caducidad:cy.anio||'',mes_caducidad:cy.mes||'',
      caducidad_prolongada:l.caducidad_prolongada?1:0,resaltado:l.resaltado?1:0,resultado:res,observaciones:l.observaciones,equipo_id:eqId.get(ek),_ek:ek});
  }
  const lastFor=new Map(); for (const r of rowsNs) lastFor.set(r._ek,r.id);
  for (const r of rowsNs) { r.ultima_revision=lastFor.get(r._ek)===r.id?1:0; delete r._ek; }
  T.numeros_serie=rowsNs;
  T.certificados_completo=certs.map(c=>{ const cl=cli(c.cliente_id), is=ins(c.instalacion_id), ls=rowsNs.filter(r=>r.cert_id===c.cert_id);
    return {cert_id:c.cert_id,codigo:c.codigo,fecha_revision:c.fecha_revision,fecha_proxima_revision:c.fecha_proxima_revision,cliente_id:c.cliente_id,cliente:cl.nombre||'',cif:cl.cif||'',cliente_direccion:cl.direccion||'',cliente_poblacion:[cl.poblacion,cl.codigo_postal].filter(Boolean).join(' '),
      instalacion_id:c.instalacion_id,instalacion:is.nombre||'',instalacion_actividad:is.actividad||'',instalacion_direccion:is.direccion||'',instalacion_poblacion:[is.poblacion,is.codigo_postal].filter(Boolean).join(' '),
      n_equipos:ls.length,n_apto:ls.filter(r=>r.resultado==='APTO').length,n_no_apto:ls.filter(r=>r.resultado==='NO APTO').length,observaciones:c.observaciones||'',observaciones_en:c.observaciones_en||'',idioma:c.idioma||'ES',
      es_ultima_de_instalacion:lastBy.get(c.instalacion_id)===c.cert_id?1:0,modificado:c.modificado||'',ficheros_origen:c.ficheros_origen||'',
      equipos_json:JSON.stringify(ls.map(r=>({articulo:r.articulo,numero_serie:r.numero_serie,usuario:r.usuario,fecha_fabrica:r.fecha_fabrica,fecha_caducidad:r.fecha_caducidad,resultado:r.resultado,observaciones:r.observaciones})))};});
  return T;
};

/* tablas (de un ZIP) -> base de datos en memoria */
C.fromTables = function (T) {
  const db=C.emptyDb(); const num=v=>v===''||v==null?null:+v;
  db.clientes=(T.clientes||[]).map(c=>({cliente_id:c.cliente_id,nombre:c.nombre||'',cif:c.cif||'',actividad:c.actividad||'',direccion:c.direccion||'',poblacion:c.poblacion||'',codigo_postal:c.codigo_postal||''}));
  db.instalaciones=(T.instalaciones||[]).map(i=>({instalacion_id:i.instalacion_id,cliente_id:i.cliente_id,nombre:i.nombre||'',actividad:i.actividad||'',direccion:i.direccion||'',poblacion:i.poblacion||'',codigo_postal:i.codigo_postal||''}));
  db.articulos=(T.articulos||[]).map(a=>({articulo_id:a.articulo_id,articulo_marca_fabricante:a.articulo_marca_fabricante||'',tipo:a.tipo||'',marca:a.marca||a.marca_detectada||'',fabricante:a.fabricante||''}));
  db.certificados=(T.certificados_completo||[]).map(c=>({cert_id:c.cert_id,codigo:c.codigo,fecha_revision:c.fecha_revision||'',fecha_proxima_revision:c.fecha_proxima_revision||'',cliente_id:c.cliente_id,instalacion_id:c.instalacion_id,observaciones:c.observaciones||'',observaciones_en:c.observaciones_en||'',idioma:c.idioma||'ES',ficheros_origen:c.ficheros_origen||'',modificado:c.modificado||c.fecha_revision||''}));
  db.lineas=(T.numeros_serie||[]).map((l,i)=>({id:num(l.id)||i+1,cert_id:l.cert_id,articulo_id:l.articulo_id,articulo:l.articulo||'',numero_serie:l.numero_serie||'',usuario:l.usuario||'',fecha_fabrica:l.fecha_fabrica||'',fecha_caducidad:l.fecha_caducidad||'',caducidad_prolongada:+l.caducidad_prolongada||0,resaltado:+l.resaltado||0,observaciones:l.observaciones||''}));
  return C.index(db);
};

/* -------------------------------------------- comparar y fusionar con otra base */
function keySets(db) {
  C.index(db);
  const ik=id=>{const i=db._ins.get(id); const c=i&&db._cli.get(i.cliente_id); return i? (c?ckey(c.nombre):'?')+'>'+ikey(i.nombre):'?'; };
  const S={clientes:new Set(),instalaciones:new Set(),articulos:new Set(),certificados:new Map(),lineas:new Set()};
  db.clientes.forEach(c=>S.clientes.add(ckey(c.nombre)));
  db.instalaciones.forEach(i=>S.instalaciones.add(ik(i.instalacion_id)));
  db.articulos.forEach(a=>S.articulos.add(norm(a.articulo_marca_fabricante)));
  for (const c of db.certificados) { const k=c.codigo+'|'+ik(c.instalacion_id)+'|'+c.fecha_revision; S.certificados.set(k,c);
    for (const l of C.certLines(db,c.cert_id)) S.lineas.add(k+'|'+(norm(l.numero_serie)||('~'+norm(l.articulo)+'|'+norm(l.usuario)))+'|'+C.tipoDe(norm(l.articulo))); }

function setIf(rec,key,val){ val=C.clean(val||''); if(key==='cif') val=C.cleanCif(val); if(!val||C.clean(rec[key]||'')===val) return false; rec[key]=val; return true; }
function commitCert(d){
  const db=S.db, rep={clienteNuevo:'',clienteActualizado:'',instNueva:'',instActualizada:'',articulosNuevos:[],lineas:0};
  let cli=C.findCliente(db,{nombre:d.cli.nombre,cif:''});
  const pc=C.splitPob(d.cli.poblacion||'');
  if(!cli){ cli=C.addCliente(db,{nombre:d.cli.nombre,cif:d.cli.cif,direccion:d.cli.direccion,poblacion:pc.poblacion,cp:pc.cp}); rep.clienteNuevo=cli.nombre; }
  else{ let ch=false; ch=setIf(cli,'cif',d.cli.cif)||ch; ch=setIf(cli,'direccion',d.cli.direccion)||ch; ch=setIf(cli,'poblacion',pc.poblacion)||ch; ch=setIf(cli,'codigo_postal',pc.cp)||ch; if(ch) rep.clienteActualizado=cli.nombre; }
  let ins=C.findInstalacion(db,cli.cliente_id,d.ins.nombre);
  const pi=C.splitPob(d.ins.poblacion||'');
  if(!ins){ ins=C.addInstalacion(db,{cliente_id:cli.cliente_id,nombre:d.ins.nombre,actividad:d.ins.actividad,direccion:d.ins.direccion,poblacion:pi.poblacion,cp:pi.cp}); rep.instNueva=ins.nombre; }
  else{ let ch=false; ch=setIf(ins,'actividad',d.ins.actividad)||ch; ch=setIf(ins,'direccion',d.ins.direccion)||ch; ch=setIf(ins,'poblacion',pi.poblacion)||ch; ch=setIf(ins,'codigo_postal',pi.cp)||ch; if(ch) rep.instActualizada=ins.nombre; }
  const lineas=d.lineas.map(l=>{ const n0=db.articulos.length; const a=C.addArticulo(db,{texto:l.articulo}); if(db.articulos.length>n0) rep.articulosNuevos.push(a.articulo_marca_fabricante); return {...l,articulo_id:a.articulo_id,articulo:a.articulo_marca_fabricante}; });
  const c=C.saveCert(db,{cert_id:d.certId||undefined,codigo:d.codigo,fecha_revision:d.frev,fecha_proxima_revision:d.fprox,cliente_id:cli.cliente_id,instalacion_id:ins.instalacion_id,observaciones:d.obs},lineas);
  if(!d.certId) c.ficheros_origen='Inseg Revisiones';
  rep.lineas=lineas.length; rep.cert=c; rep.cli=cli; rep.ins=ins;
  C.index(db); C.touch(db); persist();
  // comprobación: el certificado y todas sus líneas deben salir en las tablas de las bases de datos
  const T=C.toTables(db);
  rep.verificado=!!T.certificados.find(x=>x.cert_id===c.cert_id)&&!!T.certificados_completo.find(x=>x.cert_id===c.cert_id)&&T.numeros_serie.filter(x=>x.cert_id===c.cert_id).length===lineas.length&&!!T.clientes.find(x=>x.cliente_id===cli.cliente_id)&&!!T.instalaciones.find(x=>x.instalacion_id===ins.instalacion_id);
  return rep;
}

async function imgToPng(file,maxW,maxH){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('No se pudo leer la imagen. Usa PNG, JPG o WebP.')); i.src=url; });
    const k=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight), w=Math.max(1,Math.round(img.naturalWidth*k)), hh=Math.max(1,Math.round(img.naturalHeight*k));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; const g=cv.getContext('2d'); g.drawImage(img,0,0,w,hh);   // sin fondo: se conserva la transparencia
    if (!/png|webp|gif|svg/i.test(file.type||'')) {   // JPG: no tiene transparencia, el blanco del fondo pasa a transparente
      const d=g.getImageData(0,0,w,hh), p=d.data;
      for (let i=0;i<p.length;i+=4){ const m=Math.min(p[i],p[i+1],p[i+2]); if (m>=245) p[i+3]=0; else if (m>215) p[i+3]=Math.round(255*(245-m)/30); }
      g.putImageData(d,0,0);
    }
    return {data:cv.toDataURL('image/png'),w,h:hh};
  } finally { URL.revokeObjectURL(url); }
}

/* ======================================================================
   Sincronización con OneDrive (trabajo local primero)
   - Los datos se guardan siempre en este dispositivo (IndexedDB).
   - Con internet y sesión, se comparan con OneDrive/INSEGREVISION/repi_datos.json
     usando su eTag. Los certificados .docx/.pdf generados se suben a
     OneDrive/INSEGREVISION/Certificados.
   ====================================================================== */
const SY={cfg:{clientId:'',tenant:'organizations'},tok:null,etag:'',dirty:false,pend:0,files:0,lastOk:'',lastCheck:'',remote:null,busy:false,err:'',errKind:'',account:'',report:null,behind:false,
  avail:/^https?:$/.test(location.protocol)};
const GRAPH='https://graph.microsoft.com/v1.0', RFILE='/me/drive/root:/INSEGREVISION/repi_datos.json', CDIR='/me/drive/root:/INSEGREVISION/Certificados/';
const saveSy=()=>idb.put('sync',{etag:SY.etag,dirty:SY.dirty,pend:SY.pend,lastOk:SY.lastOk,remote:SY.remote,account:SY.account}).catch(()=>{});
const aerr=(kind,msg)=>{ const e=new Error(msg||kind); e.kind=kind; return e; };
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
const SCOPE='Files.ReadWrite User.Read offline_access';
const isOnline=()=>navigator.onLine!==false;
const ready=()=>SY.avail&&SY.cfg.clientId&&SY.tok;

/* ---- inicio de sesión (Microsoft Entra, flujo con PKCE, sin servidor) */
async function tokenReq(params){
  let r; try{ r=await fetch(`https://login.microsoftonline.com/${encodeURIComponent(SY.cfg.tenant||'organizations')}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:SY.cfg.clientId,scope:SCOPE,...params})}); }
  catch(e){ const x=new Error('Sin conexión'); x.net=true; throw x; }
  const j=await r.json().catch(()=>({})); if(!r.ok) throw aerr('login',j.error_description||j.error||('Error '+r.status)); return j;
}
async function setTok(r){ SY.tok={access:r.access_token,refresh:r.refresh_token||(SY.tok&&SY.tok.refresh)||'',exp:Date.now()+Math.max(60,(r.expires_in||3600)-120)*1000}; await idb.put('tok',SY.tok).catch(()=>{}); }
async function token(force){
  const t=SY.tok; if(!t) throw aerr('login','Sin sesión');
  if(!force&&t.exp>Date.now()) return t.access;
  if(!t.refresh) throw aerr('login','Sesión caducada');
  try{ await setTok(await tokenReq({grant_type:'refresh_token',refresh_token:t.refresh})); return SY.tok.access; }
  catch(e){ if(e.net) throw e; SY.tok=null; await idb.put('tok',null).catch(()=>{}); throw aerr('login','Sesión caducada'); }
}
async function connect(){
  if(!SY.avail) return alertDlg('La sincronización con OneDrive solo funciona con la versión web (https), no con el fichero abierto desde el disco.');
  if(!SY.cfg.clientId){ location.hash='#/sync'; return toast('Primero configura el Id. de aplicación.'); }
  if(!isOnline()) return toast('Sin internet: no se puede iniciar sesión ahora.');
  const ver=rnd(48), st=rnd(12); const chal=b64u(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver))));
  await idb.put('pkce',{ver,st}); await flushNow(); await saveSy();
  location.href=`https://login.microsoftonline.com/${encodeURIComponent(SY.cfg.tenant||'organizations')}/oauth2/v2.0/authorize?`+new URLSearchParams({client_id:SY.cfg.clientId,response_type:'code',redirect_uri:redirectUri(),response_mode:'query',scope:SCOPE,code_challenge:chal,code_challenge_method:'S256',state:st,prompt:'select_account'});
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search); if(!q.get('code')&&!q.get('error')) return;
  const clean=()=>history.replaceState(null,'',redirectUri()+'#/sync');
  if(q.get('error')){ SY.err=(q.get('error_description')||q.get('error')).split(/\r?\n/)[0]; SY.errKind='login'; clean(); return; }
  try{ const p=await idb.get('pkce'); if(!p||p.st!==q.get('state')) throw new Error('La respuesta del inicio de sesión no es válida. Inténtalo de nuevo.');
    await setTok(await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:redirectUri(),code_verifier:p.ver})); await idb.put('pkce',null).catch(()=>{}); SY.err=''; SY.errKind='';
    try{ const me=await (await gfetch('/me?$select=displayName,userPrincipalName')).json(); SY.account=me.userPrincipalName||me.displayName||''; }catch(e){}
  }catch(e){ SY.err=e.message; SY.errKind='login'; }
  clean();
}
async function signOut(){ SY.tok=null; SY.account=''; await idb.put('tok',null).catch(()=>{}); await saveSy(); renderSync(); drawSyncPanel(); }

/* ---- Microsoft Graph */
async function gfetch(path,opt,retry){
  const t=await token(retry); let r;
  try{ r=await fetch(GRAPH+path,{...(opt||{}),headers:{Authorization:'Bearer '+t,...((opt&&opt.headers)||{})}}); }
  catch(e){ const x=new Error('Sin conexión'); x.net=true; throw x; }
  if(r.status===401&&!retry) return gfetch(path,opt,true);
  if(r.status===401) throw aerr('login','Sin acceso');
  return r;
}
const httpErr=async r=>{ let m=''; try{ m=(await r.json()).error.message; }catch(e){} return aerr(r.status===403?'perm':'srv',`OneDrive respondió ${r.status}${m?': '+m:''}`); };
async function remoteMeta(){ const r=await gfetch(RFILE+'?select=id,eTag,size,lastModifiedDateTime'); if(r.status===404) return null; if(!r.ok) throw await httpErr(r); const j=await r.json(); return {etag:j.eTag,size:j.size,mod:j.lastModifiedDateTime}; }
async function remoteGet(){ const r=await gfetch(RFILE+':/content'); if(!r.ok) throw await httpErr(r); return JSON.parse(await r.text()); }
async function remotePut(text,etag){
  const body=new TextEncoder().encode(text), h={'Content-Type':'application/json'}; if(etag) h['If-Match']=etag;
  let j;
  if(body.length>3500000){
    const r=await gfetch(RFILE+':/createUploadSession',{method:'POST',headers:h,body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
    if(r.status===412) throw aerr('conflict'); if(!r.ok) throw await httpErr(r);
    const {uploadUrl}=await r.json(); let u; try{ u=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes 0-${body.length-1}/${body.length}`},body}); }catch(e){ const x=new Error('Sin conexión'); x.net=true; throw x; }
    if(!u.ok) throw await httpErr(u); j=await u.json();
  }else{
    const r=await gfetch(RFILE+':/content',{method:'PUT',headers:h,body}); if(r.status===412||r.status===409) throw aerr('conflict'); if(!r.ok) throw await httpErr(r); j=await r.json();
  }
  return {etag:j.eTag,size:j.size,mod:j.lastModifiedDateTime};
}
/* certificados generados (docx/pdf) que esperan a subirse */
async function queueFiles(files){
  if(!SY.avail) return;
  const q=(await idb.get('cola').catch(()=>null))||[];
  for(const f of files){ const it={name:f.name,type:f.type||'application/octet-stream',data:typeof f.data==='string'?new TextEncoder().encode(f.data):f.data}; const i=q.findIndex(x=>x.name===f.name); if(i>=0) q[i]=it; else q.push(it); }
  await idb.put('cola',q); SY.files=q.length; renderSync(); schedule(4000);
}
async function flushQueue(){
  let q=(await idb.get('cola').catch(()=>null))||[];
  while(q.length){ const f=q[0]; const r=await gfetch(CDIR+encodeURIComponent(f.name)+':/content',{method:'PUT',headers:{'Content-Type':f.type},body:f.data}); if(!r.ok) throw await httpErr(r); q=q.slice(1); await idb.put('cola',q); SY.files=q.length; renderSync(); }
}
const emptyLocal=()=>!S.db.certificados.length&&!S.db.clientes.length;
function adoptInPlace(remote){            // se sustituye el contenido sin cambiar el objeto (por si hay una pantalla abierta)
  const nd=C.index(Object.assign(C.emptyDb(),remote)); for(const k of Object.keys(S.db)) delete S.db[k]; Object.assign(S.db,nd); C.index(S.db);
}

/* ---- sincronizar */
let syncTimer=null;
function schedule(ms){ clearTimeout(syncTimer); if(ready()&&isOnline()) syncTimer=setTimeout(()=>syncNow({bg:true}),ms||3000); }
const editorOpen=()=>!!document.querySelector('.lr');
async function syncNow(opt){
  opt=opt||{};
  if(!SY.avail||SY.busy) return;
  if(!SY.cfg.clientId||!SY.tok){ renderSync(); if(opt.manual) { if(!SY.cfg.clientId) location.hash='#/sync'; else connect(); } return; }
  if(!isOnline()){ renderSync(); if(opt.manual) toast('Sin internet. Tus cambios están guardados en este dispositivo y se enviarán a OneDrive cuando vuelva la conexión.',5000); return; }
  SY.busy=true; renderSync(); drawSyncPanel();
  const rep={acciones:[],merge:null};
  let changedLocal=false;
  try{
    let meta=await remoteMeta();
    for(let i=0;i<3;i++){
      if(!meta){
        if(emptyLocal()){ rep.acciones.push('OneDrive todavía no tiene el fichero de datos y este dispositivo tampoco. Sube repi_datos.json a la carpeta INSEGREVISION de tu OneDrive, o importa un ZIP.'); SY.remote=null; SY.behind=false; break; }
        const r=await remotePut(JSON.stringify(C.stripIndex(S.db)),null); SY.etag=r.etag; SY.remote=r; SY.dirty=false; SY.pend=0; SY.behind=false; rep.acciones.push('Datos subidos a OneDrive por primera vez.'); break; }
      if(meta.etag===SY.etag){
        if(!SY.dirty){ SY.remote=meta; SY.behind=false; break; }
        try{ const r=await remotePut(JSON.stringify(C.stripIndex(S.db)),meta.etag); SY.etag=r.etag; SY.remote=r; SY.dirty=false; SY.pend=0; SY.behind=false; rep.acciones.push('Cambios de este dispositivo subidos a OneDrive.'); break; }
        catch(e){ if(e.kind==='conflict'){ meta=await remoteMeta(); continue; } throw e; } }
      // OneDrive tiene una versión distinta a la última que vi
      if(opt.bg&&editorOpen()&&!SY.dirty){ SY.behind=true; SY.remote=meta; break; }       // no cambiar datos mientras editas
      const remote=await remoteGet();
      if(!SY.dirty||emptyLocal()){ adoptInPlace(remote); SY.etag=meta.etag; SY.remote=meta; SY.dirty=false; SY.pend=0; SY.behind=false; await flushNow(); changedLocal=true; rep.acciones.push(`Datos descargados de OneDrive (${S.db.certificados.length} certificados).`); break; }
      const mr=C.merge(S.db,C.index(remote)); await flushNow(); changedLocal=true; rep.merge=mr;
      try{ const r=await remotePut(JSON.stringify(C.stripIndex(S.db)),meta.etag); SY.etag=r.etag; SY.remote=r; SY.dirty=false; SY.pend=0; SY.behind=false; rep.acciones.push('Los cambios de este dispositivo y los de OneDrive se han unido y subido.'); break; }
      catch(e){ if(e.kind==='conflict'){ meta=await remoteMeta(); SY.dirty=true; continue; } throw e; }
    }
    await flushQueue();
    SY.lastOk=C.nowIso(); SY.lastCheck=SY.lastOk; SY.err=''; SY.errKind=''; SY.report=rep;
  }catch(e){ handleSyncErr(e); }
  finally{ SY.busy=false; await saveSy(); renderSync(); drawSyncPanel(); if(changedLocal&&!editorOpen()&&!/#\/(sync|importar|zip|aspecto)/.test(location.hash)) route(); }
  return rep;
}
function handleSyncErr(e){
  if(e.net||e instanceof TypeError){ SY.errKind='net'; SY.err='Sin conexión con OneDrive'; }
  else if(e.kind==='login'){ SY.errKind='login'; SY.err='Hay que volver a conectar con OneDrive'; }
  else { SY.errKind=e.kind||'srv'; SY.err=e.message||'Error de OneDrive'; }
}
async function checkRemote(){
  if(!ready()||SY.busy||!isOnline()) { renderSync(); return; }
  try{ const meta=await remoteMeta(); SY.lastCheck=C.nowIso();
    if((meta&&meta.etag!==SY.etag)||(!meta&&!emptyLocal())||SY.dirty||SY.files) return syncNow({bg:true});
    SY.errKind=''; SY.err=''; SY.remote=meta; if(!SY.lastOk) SY.lastOk=SY.lastCheck; await saveSy();
  }catch(e){ handleSyncErr(e); }
  renderSync(); drawSyncPanel();
}

/* ---- indicadores de la cabecera */
function syncStatus(){
  if(!SY.avail) return {c:'',t:'OneDrive: usa la versión web'};
  if(!SY.cfg.clientId) return {c:'bad',t:'OneDrive sin configurar'};
  const pend=SY.pend+SY.files, pt=pend?` · ${plural(pend,'cambio','cambios')} sin enviar`:'';
  if(!SY.tok) return SY.errKind==='login'?{c:'bad',t:'Sin acceso a OneDrive · volver a conectar'+pt}:{c:'bad',t:'OneDrive sin conectar'+pt};
  if(!isOnline()||SY.errKind==='net') return {c:'bad',t:'Sin internet'+pt};
  if(SY.busy) return {c:'warn',t:'Sincronizando…'};
  if(SY.errKind==='login') return {c:'bad',t:'Sin acceso a OneDrive · volver a conectar'+pt};
  if(SY.errKind) return {c:'bad',t:'Sin acceso a OneDrive'+pt};
  if(SY.behind) return {c:'bad',t:'OneDrive tiene datos más recientes'};
  if(SY.dirty||SY.files) return {c:'bad',t:'Sin sincronizar'+pt};
  if(!SY.lastOk) return {c:'bad',t:'Sin comprobar con OneDrive'};
  return {c:'ok',t:'Sincronizado con OneDrive'};
}
function renderSync(){
  const s=syncStatus(), el=$('#sync'); if(el){ el.className='chip '+s.c; el.textContent=s.t; el.title='Ver el estado de la sincronización'; }
  const b=$('#syncbtn'); if(b){ b.hidden=!SY.avail; b.disabled=SY.busy; b.textContent=ready()?'Sincronizar':(SY.cfg.clientId?'Conectar':'Configurar'); }
}

/* ---- pantalla de estado y configuración */
const when=iso=>iso?new Date(iso).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}):'—';
function drawSyncPanel(){
  const host=$('#sy-status'); if(!host) return; const s=syncStatus(); const rep=SY.report;
  const kb=n=>n==null?'—':(n/1024).toFixed(0)+' KB';
  host.replaceChildren(...[
    h('div',{class:'msg '+(s.c==='ok'?'ok':s.c==='warn'?'info':s.c==='bad'?'err':'info')},h('b',null,s.t),SY.err&&s.c==='bad'?h('div',{class:'hint'},SY.err):null),
    h('table',{class:'kv'},h('tbody',null,
      h('tr',null,h('td',null,'Conexión'),h('td',null,isOnline()&&SY.errKind!=='net'?'En línea':'Sin internet')),
      h('tr',null,h('td',null,'Cuenta'),h('td',null,SY.tok?(SY.account||'Conectada'):'Sin conectar')),
      h('tr',null,h('td',null,'Última sincronización'),h('td',null,when(SY.lastOk))),
      h('tr',null,h('td',null,'Pendiente de enviar'),h('td',null,SY.pend||SY.files?`${plural(SY.pend,'cambio','cambios')} y ${plural(SY.files,'fichero','ficheros')} (.docx/.pdf)`:'Nada')),
      h('tr',null,h('td',null,'Fichero en OneDrive'),h('td',null,'INSEGREVISION/repi_datos.json',SY.remote?h('div',{class:'hint'},`${kb(SY.remote.size)} · modificado ${when(SY.remote.mod)}`):h('div',{class:'hint'},'Aún no se ha comprobado'))))),
    rep?h('div',{style:'margin-top:10px'},h('h2',null,'Último resultado'),h('ul',null,(rep.acciones.length?rep.acciones:['Ya estaba todo igual en OneDrive y en este dispositivo.']).map(a=>h('li',null,a)),
      rep.merge?h('li',null,`Unión: ${plural(rep.merge.certificados||0,'certificado nuevo','certificados nuevos')}, ${plural(rep.merge.actualizados||0,'certificado actualizado','certificados actualizados')}, ${plural(rep.merge.eliminados||0,'eliminado','eliminados')}, ${plural(rep.merge.clientes||0,'cliente nuevo','clientes nuevos')}, ${plural(rep.merge.articulos||0,'equipo nuevo','equipos nuevos')}.`):null)):null,
    rep&&rep.merge&&rep.merge.repList?h('div',{class:'msg warn'},'Estos certificados creados en otro dispositivo repiten un número que ya existía. Cambia el número de uno de los dos:',h('ul',null,rep.merge.repList.map(id=>{ const c=S.db._cert.get(id); return c?h('li',null,h('a',{href:'#/cert-mod/'+id},certLabel(c))):null; }))):null].filter(Boolean));
}
function viewSync(){
  const cid=txt(SY.cfg.clientId,'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'), ten=txt(SY.cfg.tenant,'organizations o el Id. del directorio');
  const ru=h('input',{type:'text',readonly:true,value:redirectUri()});
  const forceUp=h('button',{class:'btn',onclick:async()=>{ if(!ready()||!isOnline()) return alertDlg('Necesitas internet y la sesión de OneDrive iniciada.'); if(!(await confirmDlg('Se sustituirá el fichero de OneDrive por los datos de este dispositivo.\nLo que solo exista en OneDrive se perderá.','Subir y sustituir',true))) return;
      try{ SY.busy=true; renderSync(); const m=await remoteMeta(); const r=await remotePut(JSON.stringify(C.stripIndex(S.db)),m&&m.etag); SY.etag=r.etag; SY.remote=r; SY.dirty=false; SY.pend=0; SY.behind=false; SY.lastOk=C.nowIso(); SY.err=''; SY.errKind=''; SY.report={acciones:['OneDrive sustituido por los datos de este dispositivo.']}; await flushQueue(); }catch(e){ handleSyncErr(e); } SY.busy=false; await saveSy(); renderSync(); drawSyncPanel(); }},'Subir este dispositivo a OneDrive (sustituir)');
  const forceDown=h('button',{class:'btn',onclick:async()=>{ if(!ready()||!isOnline()) return alertDlg('Necesitas internet y la sesión de OneDrive iniciada.'); if(!(await confirmDlg('Se sustituirán los datos de este dispositivo por los de OneDrive.\nLo que solo exista aquí se perderá.','Descargar y sustituir',true))) return;
      try{ SY.busy=true; renderSync(); const m=await remoteMeta(); if(!m) throw aerr('srv','OneDrive no tiene el fichero de datos.'); adoptInPlace(await remoteGet()); await flushNow(); SY.etag=m.etag; SY.remote=m; SY.dirty=false; SY.pend=0; SY.behind=false; SY.lastOk=C.nowIso(); SY.err=''; SY.errKind=''; SY.report={acciones:['Este dispositivo sustituido por los datos de OneDrive.']}; }catch(e){ handleSyncErr(e); } SY.busy=false; await saveSy(); renderSync(); drawSyncPanel(); }},'Descargar OneDrive a este dispositivo (sustituir)');
  view(head('Sincronización con OneDrive','Los datos se guardan siempre en este dispositivo. Con internet y sesión iniciada se comparan con tu OneDrive de empresa.'),
    !SY.avail?h('div',{class:'msg warn'},'Esta copia está abierta desde un fichero del disco: la sincronización con OneDrive solo funciona con la versión web (https), que además se puede instalar en el móvil.'):null,
    h('div',{class:'card'},h('div',{id:'sy-status'}),
      h('div',{class:'bar'},h('button',{class:'btn pri',onclick:()=>ready()?syncNow({manual:true}):(SY.cfg.clientId?connect():toast('Guarda primero el Id. de aplicación.'))},ready()?'Sincronizar ahora':'Conectar con OneDrive'),ready()?h('button',{class:'btn',onclick:signOut},'Cerrar sesión de OneDrive'):null),
      ready()?h('details',{style:'margin-top:10px'},h('summary',null,'Opciones avanzadas'),h('div',{class:'bar'},forceUp,forceDown)):null),
    h('div',{class:'card'},h('h2',null,'Configuración'),

/* ------------------------------------------------------------ lector con la cámara */
function scanPanel(onCode,onClose){
  const video=h('video',{autoplay:true,playsinline:true,muted:true,style:'width:100%;max-height:170px;background:#000;border-radius:6px;object-fit:cover'});
  video.muted=true;

  const closeBtn=h('button',{class:'btn sm',type:'button',onclick:()=>stop()},'Cerrar cámara');
  const file=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true});
  const photoBtn=h('button',{class:'btn sm pri',type:'button',onclick:()=>file.click()},'Hacer foto al QR');
  const gal=h('input',{type:'file',accept:'image/*',hidden:true});
  const galBtn=h('button',{class:'btn sm',type:'button',onclick:()=>gal.click()},'Elegir foto de la galería');
  const pasteIn=h('input',{type:'text',placeholder:'o pega aquí el texto del QR (empieza por INSEG)',style:'flex:1;min-width:180px','aria-label':'Texto del QR'});
  const pasteBtn=h('button',{class:'btn sm',type:'button',onclick:()=>{ const t=pasteIn.value.trim(); if(!t) return; pasteIn.value=''; try{ onCode(t,api); }catch(e){ console.error(e); } }},'Usar texto');
  const el=h('div',{class:'card scanpanel',role:'region','aria-label':'Escáner de QR'},video,msg,h('div',{class:'bar',style:'margin:8px 0 0'},act,photoBtn,galBtn,closeBtn),h('div',{class:'bar',style:'margin:8px 0 0'},pasteIn,pasteBtn),file,gal);
  gal.addEventListener('change',()=>{ const f=gal.files&&gal.files[0]; gal.value=''; if(f) readPhoto(f); });
  const noLive=t=>{ video.style.display='none'; closeBtn.textContent='Cerrar'; api.say(t,'warn'); };
  async function readPhoto(f){
    api.say('Leyendo la foto…','');
    let bmp=null; try{ bmp=await createImageBitmap(f); }catch(e){ try{ const u=URL.createObjectURL(f); bmp=await new Promise((ok,ko)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=ko; im.src=u; }); }catch(e2){ bmp=null; } }
    if(!bmp){ api.say('No se pudo abrir la foto. Repite la foto.','bad'); return; }
    const bw=bmp.width||bmp.naturalWidth, bh=bmp.height||bmp.naturalHeight; let text=null;
    if('BarcodeDetector' in window){ try{ const d=new BarcodeDetector({formats:['qr_code']}); const r=await d.detect(bmp); if(r[0]) text=r[0].rawValue; }catch(e){} }
    for(const mx of [1600,1100,800,2200]){ if(text!=null) break; const k=Math.min(1,mx/Math.max(bw,bh)); const W=Math.max(1,Math.round(bw*k)), Hh=Math.max(1,Math.round(bh*k)); cv.width=W; cv.height=Hh; g.drawImage(bmp,0,0,W,Hh); try{ text=QR.decode(g.getImageData(0,0,W,Hh)); }catch(e){ text=null; } await sleep(0); }
    if(text==null){ api.say('No se ha podido leer el QR en la foto. Acércate hasta que se vea entero, con luz y bien enfocado, y repite.','bad',[h('button',{class:'btn sm pri',type:'button',onclick:()=>file.click()},'Hacer otra foto')]); return; }
    try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} try{ onCode(text,api); }catch(e){ console.error(e); } }
  file.addEventListener('change',()=>{ const f=file.files&&file.files[0]; file.value=''; if(f) readPhoto(f); });
  let stream=null,done=false,det=null,last='',seen=0; const cv=document.createElement('canvas'), g=cv.getContext('2d',{willReadFrequently:true});
  const api={el,say:(t,kind,btns)=>{ msg.textContent=t; msg.className='scanmsg '+(kind||''); act.replaceChildren(...(btns||[])); },stop};
  function stop(){ if(done) return; done=true; try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} el.remove(); onClose&&onClose(); }
  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ noLive('Chrome no deja usar la cámara en directo desde un fichero suelto. Pulsa «Hacer foto al QR» (o «Elegir foto de la galería» si ya la tienes hecha).'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
    catch(e){ noLive((e&&e.name==='NotAllowedError'?'No hay permiso para la cámara en directo en esta página.':'No se pudo abrir la cámara en directo.')+' Pulsa «Hacer foto al QR» (o «Elegir foto de la galería» si ya la tienes hecha).'); return; }
    if(done){ stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject=stream; try{ await video.play(); }catch(e){}
    if('BarcodeDetector' in window){ try{ det=new BarcodeDetector({formats:['qr_code']}); }catch(e){ det=null; } }
    api.say('Enfoca el QR de un equipo. Puedes seguir escaneando otros.','');
    while(!done){ await sleep(det?110:180); if(done) break; if(video.readyState<2||!video.videoWidth) continue; let text=null;
      if(det){ try{ const r=await det.detect(video); if(r[0]) text=r[0].rawValue; }catch(e){ det=null; } }
      if(text==null&&!det){ const W=Math.min(video.videoWidth,960), Hh=Math.round(video.videoHeight*W/video.videoWidth); cv.width=W; cv.height=Hh; g.drawImage(video,0,0,W,Hh); try{ text=QR.decode(g.getImageData(0,0,W,Hh)); }catch(e){ text=null; } }
      if(text){ const now=Date.now(); const nuevo=text!==last||now-seen>1500; seen=now; if(nuevo){ last=text; try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} try{ onCode(text,api); }catch(e){ console.error(e); } } } }
  }
  api.start=start; api.photo=()=>file.click(); api.live=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); return api;
}

  const out=h('div'); const inp=h('input',{type:'file',accept:'.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document',multiple:true,id:'fimp'});
  const drop=h('div',{class:'card'},h('p',{style:'margin-top:0'},'Elige uno o varios certificados REPI (.doc o .docx). Primero verás qué se añadiría; no se guarda nada hasta que lo confirmes.'),field('Documentos',inp));
  inp.addEventListener('change',async()=>{
    const files=[...inp.files]; if(!files.length) return;
    out.replaceChildren(h('div',{class:'msg info'},'Leyendo documentos…'));
    const trial=C.index(structuredClone(C.stripIndex(S.db))); const reps=[];
    for(const f of files){
      try{ const tables=await R.readTables(new Uint8Array(await f.arrayBuffer()),f.name); const blocks=C.parseBlocks(tables); reps.push(C.importBlocks(trial,blocks,f.name)); }
      catch(e){ reps.push({fichero:f.name,clientesNuevos:[],instalacionesNuevas:[],articulosNuevos:[],certNuevos:[],certExistentes:[],lineasNuevas:0,lineasYaExistian:0,avisos:['No se pudo leer: '+e.message]}); }
    }
    const tot={cli:0,ins:0,art:0,cert:0,lin:0}; reps.forEach(r=>{tot.cli+=r.clientesNuevos.length;tot.ins+=r.instalacionesNuevas.length;tot.art+=r.articulosNuevos.length;tot.cert+=r.certNuevos.length;tot.lin+=r.lineasNuevas;});
    const hay=tot.cli+tot.ins+tot.art+tot.cert+tot.lin>0;
    out.replaceChildren(
      ...reps.map(r=>h('div',{class:'card'},h('h2',null,r.fichero),h('ul',null,repList('Clientes nuevos',r.clientesNuevos),repList('Instalaciones nuevas',r.instalacionesNuevas),repList('Equipos nuevos',r.articulosNuevos),repList('Certificados nuevos',r.certNuevos),
        r.certExistentes.length?h('li',null,`Certificados que ya estaban: ${r.certExistentes.length}`):null,r.lineasNuevas?h('li',null,`Líneas de equipos nuevas: `,h('b',null,r.lineasNuevas)):null,r.lineasYaExistian?h('li',null,`Líneas que ya estaban: ${r.lineasYaExistian}`):null),
        r.avisos.map(a=>h('div',{class:'msg warn'},a)))),
      hay?h('div',{class:'msg info'},`Se añadirían: ${plural(tot.cert,'certificado','certificados')}, ${plural(tot.cli,'cliente','clientes')}, ${plural(tot.ins,'instalación','instalaciones')}, ${plural(tot.art,'equipo','equipos')} y ${plural(tot.lin,'línea','líneas')}.`):h('div',{class:'msg ok'},'Todo lo que contienen estos documentos ya está en las bases de datos. No hay nada que añadir.'),
      hay?h('div',{class:'bar'},h('button',{class:'btn pri',onclick:()=>{ S.db=trial; C.touch(S.db); persist(); toast('Base de datos actualizada'); inp.value=''; viewImportar(); }},'Añadir a la base de datos'),h('a',{class:'btn',href:'#/'},'Cancelar')):null);
  });
  view(head('Importar certificado','Lee un documento .doc o .docx y añade a las bases de datos lo que todavía no esté.'),drop,out);
}

/* ================================================== 3. importar / exportar ZIP */
const ZIP_TABLES=Object.keys(C.COLS);
async function buildZip(){
  const db=S.db, T=C.toTables(db), files=[];
  files.push({name:'repi_datos.json',data:JSON.stringify(C.stripIndex(db))});
  for(const n of ZIP_TABLES) files.push({name:n+'.csv',data:'﻿'+G.toCsv(T[n],C.COLS[n])});
  files.push({name:'meta.json',data:JSON.stringify({app:'Inseg Revisiones',version:VERSION,exportado:C.nowIso(),actualizado:db.meta.updated,cuenta:{clientes:db.clientes.length,instalaciones:db.instalaciones.length,articulos:db.articulos.length,certificados:db.certificados.length,lineas:db.lineas.length}})});
  return G.zip(files);
}
async function readZipDb(buf){
  const z=await R.unzip(buf); const names=Object.keys(z); const dec=new TextDecoder('utf-8');
  const find=n=>names.find(x=>x.split('/').pop().toLowerCase()===n);
  if(find('repi_datos.json')){ const d=JSON.parse(dec.decode(await z[find('repi_datos.json')]())); if(!d||!Array.isArray(d.certificados)) throw new Error('El JSON del ZIP no tiene el formato esperado.'); return C.index(Object.assign(C.emptyDb(),d)); }
  const T={}; for(const n of ZIP_TABLES){ const f=find(n+'.csv'); if(!f) continue; const rows=G.parseCsv(dec.decode(await z[f]())); const hd=rows.shift()||[]; T[n]=rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(hd.map((k,i)=>[k,r[i]==null?'':r[i]]))); }
  if(!T.certificados_completo||!T.numeros_serie) throw new Error('El ZIP no contiene las bases de datos de Inseg Revisiones.');
  return C.fromTables(T);
}
function viewZip(){
  const exp=h('div'), imp=h('div');
  const bExp=h('button',{class:'btn pri',onclick:async()=>{ bExp.disabled=true; try{ const zip=await buildZip(); const name=`REPI base de datos ${C.today()}.zip`; const r=await saveFiles([{name,data:zip,type:'application/zip'}]); S.lastZip=name;
      exp.replaceChildren(h('div',{class:'msg ok'},r.modo==='carpeta'?`ZIP creado en ${S.dirName||FOLDER}: ${name}`:`ZIP descargado en la carpeta Descargas: ${name}`)); }catch(e){ exp.replaceChildren(h('div',{class:'msg err'},'No se pudo crear el ZIP: '+e.message)); } bExp.disabled=false; }},'Crear ZIP de la base de datos');
  const inp=h('input',{type:'file',accept:'.zip,application/zip',id:'fzip'});
  inp.addEventListener('change',async()=>{
    const f=inp.files[0]; if(!f) return; imp.replaceChildren(h('div',{class:'msg info'},'Leyendo ZIP…'));
    try{
      const other=await readZipDb(new Uint8Array(await f.arrayBuffer())); const cmp=C.compare(S.db,other,{aditivo:true});
      const rows=[['Clientes','clientes'],['Instalaciones','instalaciones'],['Equipos (catálogo)','articulos'],['Certificados','certificados'],['Líneas de equipos','lineas']];
      imp.replaceChildren(
        h('div',{class:'card'},h('table',{class:'t'},h('thead',null,h('tr',null,['','Base actual','ZIP','Nuevos en el ZIP','Solo en la actual'].map(x=>h('th',null,x)))),
          h('tbody',null,rows.map(([t,k])=>h('tr',null,h('td',null,t),h('td',null,cmp.cur[k]),h('td',null,cmp.otro[k]),h('td',null,h('b',null,cmp.nuevos[k])),h('td',null,cmp.soloActual[k])))),
          h('tfoot',null,h('tr',null,h('td',null,'Certificados modificados más recientemente en el ZIP'),h('td',{colspan:4},cmp.modificados))))),
        cmp.hayNovedades?h('div',{class:'msg info'},'Este ZIP tiene datos más recientes que la base actual.'+(cmp.actualTieneMas?' Lo que solo existe en la base actual se conserva: se fusiona, no se sustituye.':'')):h('div',{class:'msg warn'},'Este ZIP no es más reciente: no aporta ningún certificado, cliente, instalación, equipo ni línea nuevos. No se cambia nada.'),
        cmp.hayNovedades?h('div',{class:'bar'},h('button',{class:'btn pri',onclick:async()=>{ if(!(await confirmDlg('Se añadirán a la base actual los datos nuevos del ZIP.\nTe recomiendo crear antes un ZIP de la base actual.','Actualizar'))) return;
          const rep=C.merge(S.db,other,{aditivo:true}); persist(); inp.value=''; imp.replaceChildren(h('div',{class:'msg ok'},`Base de datos actualizada: ${plural(rep.certificados,'certificado nuevo','certificados nuevos')}, ${plural(rep.actualizados,'certificado actualizado','certificados actualizados')}, ${plural(rep.clientes,'cliente nuevo','clientes nuevos')}, ${plural(rep.instalaciones,'instalación nueva','instalaciones nuevas')}, ${plural(rep.articulos,'equipo nuevo','equipos nuevos')} y ${plural(rep.lineas,'línea','líneas')}.`),rep.repetidos?h('div',{class:'msg warn'},`Atención: ${plural(rep.repetidos,'certificado del ZIP trae','certificados del ZIP traen')} un número REPI que ya existía en otro certificado. Revísalos en «Modificar certificado» y cambia el número.`):null); }},'Actualizar la base de datos'),h('a',{class:'btn',href:'#/'},'Cancelar')):null);
    }catch(e){ imp.replaceChildren(h('div',{class:'msg err'},'No se pudo leer el ZIP: '+e.message)); }
  });
  view(head('Importar y exportar la base de datos','El ZIP contiene todas las bases de datos que usa Inseg Revisiones. Sirve de copia de seguridad y para pasar los datos a otro dispositivo.'),
    h('div',{class:'card'},h('h2',null,'Exportar'),h('p',{style:'margin-top:0'},`Crea un ZIP con las bases de datos (JSON y CSV) en ${S.dir&&!S.dirNeedsPerm?(S.dirName||FOLDER):'la carpeta Descargas'}.`),bExp,exp),
    h('div',{class:'card'},h('h2',null,'Importar'),h('p',{style:'margin-top:0'},'Elige un ZIP creado con esta aplicación. Solo se actualiza si trae datos más recientes: más certificados, clientes, instalaciones, equipos o líneas.'),field('Fichero ZIP',inp),imp));
}

/* ================================================== enrutado y arranque */
function route(){
  const raw=(location.hash||'#/').replace(/^#/,''); const [path,arg]=[raw.split('/')[1]||'',raw.split('/')[2]];
  const map={'':viewHome,'cliente-nuevo':viewClienteNuevo,'cliente-mod':viewClienteMod,'equipo-nuevo':viewEquipoNuevo,'equipo-mod':viewEquipoMod,'cert-nuevo':viewCertNuevo,'cert-copia':viewCertCopia,'cert-mod':()=>viewCertMod(arg),'cert-del':viewCertDel,'importar':viewImportar,'zip':viewZip,'aspecto':viewAspecto,'aspecto-logo':viewAspectoLogo,'aspecto-cabecera':viewAspectoCabecera,'aspecto-firma':viewAspectoFirma,'sync':viewSync,'qr-equipos':viewQrEquipos,'cert-pdf':viewGenerados};
  try{ (map[path]||viewHome)(); }catch(e){ console.error(e); view(h('div',{class:'msg err'},'Error en la pantalla: '+e.message),h('a',{class:'btn',href:'#/'},'Volver al inicio')); }
  setSaved(S.saved); renderSync();
}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{ if(!S.saved){ e.preventDefault(); e.returnValue=''; } });
initDb().then(async()=>{ await initSync(); route(); startSync(); }).catch(e=>{ console.error(e); $('#app').replaceChildren(h('div',{class:'msg err'},'No se pudo iniciar: '+e.message)); });
})();
